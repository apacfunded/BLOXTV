<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BloxTV Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=Montserrat:wght@800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Broadcast scene for OBS. Fixed 1920x1080 stage (or 1080x1920 with ?layout=portrait), scaled to fit. */
  /* Same skin as the site: oxblood night, siren red, Chakra Petch. */
  :root { --bg:#120607; --surface:#1e0c0e; --surface-2:#2a1215; --text:#f6e9ea; --muted:#b9999c; --accent:#e0344a; --line:#3a1a1e; --line-2:#4e252a; --live:#ff3b4e; --yellow:#ffd23f; --ok:#3fd47f; --c:#e0344a; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:#120607; overflow:hidden; font-family:Rubik, system-ui, sans-serif; color:var(--text); }
  .stage { position:absolute; top:0; left:0; width:1920px; height:1080px; transform-origin:0 0; background:var(--bg);
    background-image:radial-gradient(60% 50% at 20% 100%, rgba(224,52,74,.14), transparent 70%), radial-gradient(40% 40% at 90% 0%, rgba(94,230,255,.06), transparent 70%), repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2px, transparent 2px 5px);
    display:grid; grid-template-columns:640px 1fr; gap:56px; padding:40px 72px 44px; }
  .portrait .stage { width:1080px; height:1920px; grid-template-columns:1fr; grid-template-rows:1060px 1fr; gap:36px; padding:48px; justify-items:center; }
  /* The TV from the site, big enough for the stream */
  .phone { width:620px; height:1000px; border-radius:48px; background:linear-gradient(180deg,#8a1f2a,#5b1119 60%,#3f0b11); padding:28px 28px 60px; box-shadow:0 40px 90px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.12); position:relative; }
  .phone::before { content:""; position:absolute; left:50%; top:-30px; width:80px; height:40px; margin-left:-40px; border-radius:40px 40px 8px 8px; background:radial-gradient(circle at 50% 35%, #ff6b7a, var(--accent) 55%, #7a0f1b); box-shadow:0 0 36px rgba(255,59,78,.7); animation:siren 1.1s ease-in-out infinite; }
  @keyframes siren { 50% { box-shadow:0 0 70px rgba(255,59,78,1), 0 0 120px rgba(255,59,78,.5) } }
  .phone::after { content:"BLOXTV"; position:absolute; left:40px; bottom:18px; font:700 20px 'Chakra Petch'; letter-spacing:.14em; color:#ffd7dc; }
  .knobs { position:absolute; right:40px; bottom:14px; display:flex; gap:12px; }
  .knobs i { width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #d8d8d8, #6b6b6b 60%, #3a3a3a); box-shadow:0 2px 4px rgba(0,0,0,.6); }
  .portrait .phone { width:596px; height:1040px; }
  .phone canvas, .phone .clip-player { position:relative; z-index:1; width:100%; height:100%; border-radius:22px; display:block; box-shadow:0 0 0 5px #220508, inset 0 0 40px rgba(0,0,0,.9); }
  .off { position:absolute; left:28px; right:28px; top:28px; bottom:60px; border-radius:22px; background:repeating-radial-gradient(circle at 30% 20%, #2a2a2a 0 1px, #0a0a0a 1px 3px); box-shadow:0 0 0 5px #220508; display:grid; place-items:center; text-align:center; padding:40px; color:#fff; font:700 34px/1.2 'Chakra Petch'; text-transform:uppercase; text-shadow:0 2px 8px #000; animation:flicker .12s steps(2) infinite; }
  @keyframes flicker { 50% { opacity:.92 } }
  .clip-player { position:relative; background:#000; overflow:hidden; container-type:inline-size; }
  .clip-player video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .clip-cap { position:absolute; left:6%; right:6%; top:50%; transform:translateY(-50%); text-align:center; color:#fff; font:800 62px/1.1 Montserrat, Rubik, sans-serif; -webkit-text-stroke:2px #000; paint-order:stroke fill; text-shadow:0 4px 0 #000; }
  .clip-bars { position:absolute; top:14px; left:14px; right:14px; display:flex; gap:4px; } .clip-bars i { flex:1; height:5px; background:rgba(255,255,255,.35); border-radius:3px; overflow:hidden; } .clip-bars b { display:block; height:100%; width:0; background:#fff; }
  .tag { position:absolute; top:48px; left:48px; z-index:2; background:var(--live); color:#fff; font:700 24px 'Chakra Petch'; padding:6px 16px; border-radius:8px; letter-spacing:.06em; box-shadow:0 4px 14px rgba(0,0,0,.5); }
  .side { display:flex; flex-direction:column; gap:28px; min-width:0; width:100%; }
  .brand { display:flex; align-items:center; gap:20px; }
  .block { width:84px; height:84px; border-radius:18px; background:url(/brand/pfp-512.jpg) center/cover; box-shadow:0 6px 18px rgba(0,0,0,.5); }
  h1 { font:700 72px/1 'Chakra Petch'; letter-spacing:.02em; text-transform:uppercase; }
  .ticker { font:500 32px Rubik; color:var(--muted); margin-top:6px; }
  .card { background:var(--surface); border:2px solid var(--line); border-radius:24px; padding:30px 36px; box-shadow:0 12px 36px rgba(0,0,0,.45); }
  .label { font:700 24px 'Chakra Petch'; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:12px; }
  .dot { width:16px; height:16px; border-radius:50%; background:var(--live); animation:blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2 } }
  .now { font:700 50px/1.1 'Chakra Petch'; margin-top:12px; }
  .meter { height:40px; background:var(--surface-2); border-radius:12px; overflow:hidden; margin:18px 0 12px; border:2px solid var(--line-2); }
  .meter span { display:block; height:100%; background:linear-gradient(90deg, var(--accent), #ff7a5c); transition:width .8s ease; }
  .fund-row { display:flex; justify-content:space-between; font:500 30px Rubik; color:var(--muted); }
  .fund-row strong { font:700 40px 'Chakra Petch'; color:var(--text); }
  .script { list-style:none; padding:0; display:flex; flex-direction:column; gap:8px; margin-top:16px; font:500 28px/1.3 ui-monospace, Menlo, monospace; }
  .script li { animation:in .4s ease both; padding:6px 14px; border-left:4px solid var(--accent); background:rgba(0,0,0,.25); border-radius:0 8px 8px 0; }
  .caret { display:inline-block; width:16px; height:30px; background:var(--text); animation:blink 1s steps(2) infinite; vertical-align:middle; }
  @keyframes in { from { opacity:0; transform:translateY(8px) } }
  .feed { position:relative; height:70px; }
  .fee { position:absolute; left:0; font:700 40px 'Chakra Petch'; color:var(--ok); animation:pop 3s ease forwards; }
  @keyframes pop { 0% { opacity:0; transform:translateY(20px) } 15% { opacity:1; transform:none } 80% { opacity:1 } 100% { opacity:0; transform:translateY(-30px) } }
  .vote-how { font:500 28px Rubik; color:var(--muted); margin-top:8px; }
  .vote-how b { color:var(--text); font-weight:600; }
  .vote-opts { list-style:none; padding:0; margin:12px 0 0; display:grid; gap:8px; }
  .vote-opts li { display:grid; grid-template-columns:56px 1fr 90px; align-items:center; gap:14px; font:500 28px/1.2 Rubik; padding:10px 14px; border-radius:14px; background:rgba(0,0,0,.25); border:2px solid transparent; }
  .vote-opts li.lead { border-color:var(--accent); }
  .vote-opts .k { width:56px; height:56px; border-radius:12px; background:var(--accent); color:#fff; display:grid; place-items:center; font:700 32px 'Chakra Petch'; }
  .vote-opts .bar { height:14px; background:var(--surface-2); border-radius:7px; overflow:hidden; margin-top:8px; }
  .vote-opts .bar span { display:block; height:100%; background:var(--accent); transition:width .6s ease; }
  .vote-opts li.lead .k { background:var(--yellow); color:#120607; }
  .vote-opts li.lead .bar span { background:var(--yellow); }
  .vote-opts .n { text-align:right; font:700 34px 'Chakra Petch'; }
  .vote-foot { display:flex; justify-content:space-between; margin-top:10px; font:500 26px Rubik; color:var(--muted); }
  .side.voting .card.story { display:none; }
  .vote-last { animation:in .4s ease both; }
  .note { font-size:24px; color:var(--muted); margin:6px 0 4px; }
  .cliff { font:700 30px/1.3 'Chakra Petch'; margin:10px 0 8px; padding:12px 18px; border-left:5px solid var(--accent); background:rgba(0,0,0,.25); border-radius:8px; }
  .eps { list-style:none; padding:0; margin-top:14px; display:grid; gap:10px; font:500 28px/1.3 Rubik; }
  .eps li { display:flex; gap:16px; } .eps b { font:700 28px 'Chakra Petch'; color:var(--yellow); min-width:80px; }
  .eps .muted { color:var(--muted); }
  .foot { margin-top:auto; font:500 28px Rubik; color:var(--muted); display:flex; justify-content:space-between; gap:24px; }
  .foot code { font:500 24px ui-monospace, monospace; color:var(--text); }
  .premiere { position:absolute; inset:0; display:grid; place-items:center; background:rgba(18,6,7,.9); color:#fff; font:700 150px/1 'Chakra Petch'; text-transform:uppercase; text-align:center; opacity:0; pointer-events:none; transition:opacity .4s; }
  .premiere small { display:block; font:500 44px Rubik; margin-top:20px; color:var(--muted); }
  .premiere.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) { .dot, .caret, .script li, .fee { animation:none } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="phone" id="phone"><span class="tag" id="tag">NOW PLAYING</span><div class="off" aria-hidden="true"><span>Episode 1<br>premieres here</span></div><span class="knobs" aria-hidden="true"><i></i><i></i></span></div>
  <div class="side">
    <div class="brand"><div class="block" aria-hidden="true"></div><div><h1 id="town">BloxTV</h1><div class="ticker" id="ticker"></div></div></div>
    <div class="card" id="status"></div>
    <div class="card">
      <div class="label">Next episode</div>
      <div class="meter"><span id="bar" style="width:0"></span></div>
      <div class="fund-row"><span id="fund-text"></span><strong id="fund-pct"></strong></div>
      <div class="feed" id="feed" aria-live="polite"></div>
    </div>
    <div class="card vote" id="vote-card">
      <div class="label"><span class="dot"></span><span id="vote-q">Vote on the next episode</span></div>
      <div class="cliff" id="vote-cliff"></div>
      <div class="vote-how">Type <b>A</b>, <b>B</b> or <b>C</b> in the chat. One vote per wallet.</div>
      <ol class="vote-opts" id="vote-opts"></ol>
      <div class="vote-foot"><span id="vote-total"></span><span id="vote-last"></span></div>
    </div>
    <div class="card story"><div class="label">The story so far</div><ol class="eps" id="eps"></ol></div>
    <div class="foot"><span>Every trade buys the next episode.</span><code id="ca"></code></div>
  </div>
  <div class="premiere" id="premiere"></div>
</div>
<script src="/reel.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get("layout") === "portrait") document.body.classList.add("portrait");
  const stage = document.getElementById("stage");
  const fit = () => {
    const w = stage.offsetWidth, h = stage.offsetHeight;
    const s = Math.min(innerWidth / w, innerHeight / h);
    stage.style.transform = `translate(${(innerWidth - w * s) / 2}px, ${(innerHeight - h * s) / 2}px) scale(${s})`;
  };
  addEventListener("resize", fit); fit();

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const sol = (n) => (n >= 1 ? n.toFixed(2) : n.toFixed(3)) + " SOL";
  let S = null, player = null, playing = null, queue = [], seenReady = null;

  function playNext() {
    const ready = S.episodes.filter((e) => e.status === "ready");
    if (!ready.length) { $("#tag").textContent = "COMING SOON"; return; }
    if (!queue.length) queue = ready.map((e) => e.id); // newest first, then loop
    const ep = ready.find((e) => e.id === queue.shift()) || ready[0];
    start(ep, "NOW PLAYING");
  }
  function start(ep, tag) {
    player?.destroy();
    playing = ep;
    $("#tag").textContent = `${tag} · EP ${ep.number}`;
    player = ReelPlayer.for($("#phone"), ep, { voice: q.get("voice") === "1", sound: true, onEnd: () => setTimeout(playNext, 1200) });
    player.play();
    renderStatus();
  }
  function premiere(ep) {
    $("#premiere").innerHTML = `<div>PREMIERE<small>Episode ${ep.number}: ${esc(ep.title)}</small></div>`;
    $("#premiere").classList.add("show");
    player?.pause();
    setTimeout(() => { $("#premiere").classList.remove("show"); queue = []; start(ep, "PREMIERE"); }, 4000);
  }

  function renderStatus() {
    const making = S.episodes.find((e) => e.id === S.producing);
    if (making) {
      $("#status").innerHTML = `<div class="label"><span class="dot"></span>${making.status === "writing" ? "Writing" : `Rendering ${Math.round((making.renderProgress || 0) * 100)}%`} episode ${making.number}</div>
        ${making.status === "rendering" && making.renderNote ? `<div class="note">${esc(making.renderNote)}</div>` : ""}
        <ul class="script">${making.scenes.slice(-5).map((s) => `<li>${esc(s.line)}</li>`).join("")}${making.status === "writing" ? `<li><span class="caret"></span></li>` : ""}</ul>`;
    } else if (playing) {
      $("#status").innerHTML = `<div class="label">Episode ${playing.number}</div><div class="now">${esc(playing.title)}</div>`;
    } else {
      $("#status").innerHTML = `<div class="label">Coming soon</div><div class="now">Episode 1 starts filming when the fund is full.</div>`;
    }
  }
  function renderEps() {
    const ready = S.episodes.filter((e) => e.status === "ready").slice(0, 4);
    $("#eps").innerHTML = ready.length ? ready.map((e) => `<li><b>EP ${e.number}</b><span>${esc(e.scenes[0]?.line || e.title)}</span></li>`).join("")
      : `<li class="muted">Episode 1 is waiting on its first ${sol(S.fund.cost)} in fees.</li>`;
  }
  function renderVote(poll) {
    poll = poll || S.poll;
    const card = $("#vote-card");
    document.querySelector(".side").classList.toggle("voting", !!poll);
    if (!poll) { card.style.display = "none"; return; }
    card.style.display = "";
    $("#vote-q").textContent = poll.question;
    $("#vote-cliff").style.display = poll.cliffhanger ? "" : "none";
    $("#vote-cliff").textContent = poll.cliffhanger ? `“${poll.cliffhanger}”` : "";
    const t = poll.tally, max = Math.max(1, ...Object.values(t.counts));
    $("#vote-opts").innerHTML = poll.options.map((o) => `<li class="${t.leader?.key === o.key ? "lead" : ""}"><span class="k">${o.key}</span><div>${esc(o.label)}<div class="bar"><span style="width:${(t.counts[o.key] / max * 100).toFixed(0)}%"></span></div></div><span class="n">${t.counts[o.key]}</span></li>`).join("");
    $("#vote-total").textContent = t.total ? `${t.total} vote${t.total === 1 ? "" : "s"} · ${t.leader.key} is winning` : "No votes yet";
    if (poll.last) $("#vote-last").innerHTML = `<span class="vote-last">${esc(poll.last.name)} voted ${poll.last.key}</span>`;
  }
  function renderFund() {
    const f = S.fund, making = !!S.producing;
    const p = making ? 1 : f.progress;
    $("#bar").style.width = (p * 100).toFixed(1) + "%";
    $("#fund-text").textContent = making ? "Funded. Making it now." : `${sol(f.balance)} of ${sol(f.cost)}`;
    $("#fund-pct").textContent = Math.round(p * 100) + "%";
  }

  async function refresh() {
    S = await (await fetch("/api/state")).json();
    document.documentElement.style.setProperty("--c", S.coin.color);
    $("#town").textContent = S.coin.name || "BloxTV";
    $("#ticker").textContent = `$${S.coin.ticker} · ${S.coin.town} · live on pump.fun`;
    $("#ca").textContent = S.coin.mint ? S.coin.mint.slice(0, 6) + "…" + S.coin.mint.slice(-6) : "";
    renderFund(); renderStatus(); renderEps(); renderVote();
    const newest = S.episodes.find((e) => e.status === "ready");
    if (seenReady === null) { seenReady = newest?.id || ""; playNext(); }
    else if (newest && newest.id !== seenReady) { seenReady = newest.id; premiere(newest); }
    else if (!playing) playNext();
  }

  const es = new EventSource("/api/events");
  es.addEventListener("fees", (e) => {
    const d = JSON.parse(e.data);
    const el = document.createElement("div");
    el.className = "fee"; el.textContent = `+${sol(d.sol)} in fees`;
    $("#feed").appendChild(el); setTimeout(() => el.remove(), 3100);
    refresh();
  });
  es.addEventListener("episode", refresh);
  es.addEventListener("vote", (e) => { const p = JSON.parse(e.data); if (p && p.options && !p.closed) { S.poll = p; renderVote(p); } else refresh(); });
  es.onopen = refresh;
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
